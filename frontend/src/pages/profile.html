
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LifeSphere | My Profile</title>

  <link rel="stylesheet" href="./profile.css">
  <script src="./profile.js" defer></script>
</head>

<body>
  <main class="container">

    <header class="topbar">
      <a href="./dashboard.html" class="back-link">
        &larr; Back to Dashboard
      </a>
      <a href="./dashboard.html" class="brand">
        🌿 LifeSphere
      </a>
    </header>

    <section class="profile-banner">
      <div class="avatar" id="avatar">U</div>
      <p class="eyebrow">YOUR PERSONAL SPACE</p>
      <h1 id="headingName">My Profile</h1>
      <p>Make your LifeSphere experience personal ✨</p>
    </section>

    <section class="profile-card">
      <h2>👤 Personal Information</h2>
      <p class="subtitle">
        Update your details and tell us about yourself.
      </p>

      <form id="profileForm">
        <div class="form-grid">

          <div class="field">
            <label for="fullName">Full Name *</label>
            <input
              type="text"
              id="fullName"
              name="fullName"
              maxlength="80"
              placeholder="Enter your full name"
              autocomplete="name"
              required
            >
          </div>

          <div class="field">
            <label for="email">Email Address</label>
            <input
              type="email"
              id="email"
              name="email"
              autocomplete="email"
              readonly
            >
            <small>Email cannot be changed here.</small>
          </div>

          <div class="field">
            <label for="phone">Phone Number</label>
            <input
              type="tel"
              id="phone"
              name="phone"
              maxlength="20"
              autocomplete="tel"
              placeholder="Enter phone number"
            >
          </div>

          <div class="field">
            <label for="birthday">Date of Birth</label>
            <input
              type="date"
              id="birthday"
              name="birthday"
            >
          </div>

          <div class="field full-width">
            <label for="occupation">Occupation / Study</label>
            <input
              type="text"
              id="occupation"
              name="occupation"
              maxlength="80"
              placeholder="e.g. Student, Designer"
            >
          </div>

          <div class="field full-width">
            <label for="bio">About Me</label>
            <textarea
              id="bio"
              name="bio"
              rows="4"
              maxlength="300"
              placeholder="Write something about yourself..."
            ></textarea>
            <small>Maximum 300 characters.</small>
          </div>

        </div>

        <p id="message" role="status" aria-live="polite"></p>

        <div class="button-row">
          <button type="submit" class="save-button">
            💾 Save Changes
          </button>

          <button
            type="button"
            id="resetButton"
            class="reset-button"
          >
            ↻ Reset
          </button>
        </div>
      </form>
    </section>

    <footer>
      Made with 💜 for a more balanced life · LifeSphere
    </footer>

  </main>
</body>
</html>
