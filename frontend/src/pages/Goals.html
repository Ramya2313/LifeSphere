
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Goals | LifeSphere</title>
  <link rel="stylesheet" href="common.css">
<link rel="stylesheet" href="goals.css">
  <script src="goals.js" defer></script>
</head>
<body>
  <main class="container">
    <a class="back-link" href="dashboard.html">← Dashboard</a>

    <header>
      <h1>My Goals 🎯</h1>
      <p>Small steps lead to big achievements.</p>
    </header>

    <section class="card">
      <h2>Create a Goal</h2>

      <form id="goalForm">
        <div class="form-group">
          <label for="goalName">Goal name</label>
          <input
            type="text"
            id="goalName"
            placeholder="e.g. Learn JavaScript"
            required
          >
        </div>

        <div class="form-group">
          <label for="targetDate">Target date</label>
          <input type="date" id="targetDate" required>
        </div>

        <button type="submit">+ Add Goal</button>
        <p id="goalMessage" role="status"></p>
      </form>
    </section>

    <section class="card">
      <h2>Your Goals</h2>
      <div id="goalsList">
        <p>No goals yet. Add your first goal above!</p>
      </div>
    </section>
  </main>
</body>
</html>
