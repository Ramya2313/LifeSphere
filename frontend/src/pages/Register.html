<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LifeSphere | Register</title>
  <link rel="stylesheet" href="auth.css">
  <script src="register.js" defer></script>
</head>
<body>
  <main class="auth-container">
    <section class="auth-card">
      <a class="brand" href="login.html">🌿 LifeSphere<span>.</span></a>
      <p class="eyebrow">START YOUR JOURNEY</p>
      <h1>Create your account</h1>
      <p class="subtitle">Build better habits, one day at a time.</p>

      <form id="registerForm">
        <label for="fullName">Full name</label>
        <input id="fullName" name="fullName" type="text"
          placeholder="Your name" autocomplete="name"
          maxlength="80" required>

        <label for="email">Email address</label>
        <input id="email" name="email" type="email"
          placeholder="you@example.com" autocomplete="email" required>

        <label for="password">Password</label>
        <input id="password" name="password" type="password"
          placeholder="At least 8 characters"
          autocomplete="new-password" minlength="8" required>

        <label for="confirmPassword">Confirm password</label>
        <input id="confirmPassword" name="confirmPassword"
          type="password" placeholder="Enter password again"
          autocomplete="new-password" minlength="8" required>

        <p id="message" class="message" role="status"></p>
        <button type="submit">Create Account →</button>
      </form>

      <p class="switch-page">
        Already have an account?
        <a href="login.html">Log in</a>
      </p>
    </section>
  </main>
</body>
</html>
