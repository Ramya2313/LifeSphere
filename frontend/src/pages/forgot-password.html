
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LifeSphere | Forgot Password</title>
  <link rel="stylesheet" href="forgot-password.css">
  <script src="forgot-password.js" defer></script>
</head>
<body>
  <main class="reset-card">
    <a class="brand" href="login.html">LifeSphere<span>.</span></a>

    <div class="icon">🔐</div>

    <h1>Forgot password?</h1>
    <p class="subtitle">
      Enter your registered email address to create a new password.
    </p>

    <form id="resetForm">
      <label for="email">Email address</label>
      <input
        type="email"
        id="email"
        placeholder="you@example.com"
        autocomplete="email"
        required
      >

      <label for="newPassword">New password</label>
      <input
        type="password"
        id="newPassword"
        placeholder="At least 6 characters"
        minlength="6"
        autocomplete="new-password"
        required
      >

      <label for="confirmPassword">Confirm new password</label>
      <input
        type="password"
        id="confirmPassword"
        placeholder="Enter your new password again"
        minlength="6"
        autocomplete="new-password"
        required
      >

      <button type="submit">Reset Password</button>
      <p id="message" role="status" aria-live="polite"></p>
    </form>

    <a class="back-link" href="login.html">← Back to Login</a>
  </main>
</body>
</html>
